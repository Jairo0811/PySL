[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysl"
dynamic = ["version"]
description = "Plataforma educativa de escritorio para aprender SL y relacionarlo con Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]
build = [
    "pyinstaller>=6.11,<7.0",
]

[project.scripts]
pysl = "pysl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pysl.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", "legacy", "src/pysl.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"src/pysl/language/executor.py" = ["S102"]
"src/pysl/modules/games/**/*.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["pysl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
