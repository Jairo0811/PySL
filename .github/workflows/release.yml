name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Publicar versión estable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Validar versión del tag
        shell: pwsh
        run: |
          $packageVersion = & python -c "import sys; sys.path.insert(0, 'src'); import pysl; print(pysl.__version__)"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con la versión $packageVersion."
          }
      - name: Crear entorno virtual
        run: python -m venv .venv
      - name: Compilar y verificar
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Crear archivo distribuible
        shell: pwsh
        run: Compress-Archive -Path dist/PySL/* -DestinationPath PySL-Windows-x64.zip
      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PySL ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: PySL-Windows-x64.zip
