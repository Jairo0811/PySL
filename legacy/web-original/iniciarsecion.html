<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="css/legacy.css">
    <script src="js/login.js" defer></script>
</head>
<body class="login-page">
    <form method="POST" action="Pagina Principal.html" name="formulario" data-login-form>
        <h1>Ingresa tu nombre de Usuario y Contraseña</h1>

        <label for="n_usuario">Usuario</label>
        <input type="text" name="user" id="n_usuario" autocomplete="username">

        <label for="pwd">Contraseña:</label>
        <input type="password" name="pass" id="pwd" autocomplete="current-password">

        <input type="submit" value="Iniciar Sesion" id="btn" name="submit">
    </form>
</body>
</html>
