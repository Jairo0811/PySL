<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juego del Ahorcado</title>
    <link rel="stylesheet" href="css/legacy.css">
    <script src="js/hangman.js" defer></script>
</head>
<body>
    <form name="visor">
        <table class="hangman-table">
            <tr>
                <td colspan="3" width="33%"><p><textarea name="displayHombre" cols="14" rows="6" readonly></textarea></p></td>
                <td colspan="3" width="33%"><p><textarea name="displayLetras" cols="14" rows="6" readonly></textarea></p></td>
                <td width="34%" valign="top">
                    <p><input type="text" name="ganadas" size="4" value="0" readonly><small> Ganadas</small></p>
                    <p><input type="text" name="perdidas" size="4" value="0" readonly><small> Perdidas</small></p>
                    <p><input type="button" value="Limpiar" name="B1" data-clear-score></p>
                </td>
            </tr>
            <tr>
                <td colspan="6" width="84%"><input class="hangman-word" name="displayPalabra" size="34" readonly></td>
                <td width="16%"></td>
            </tr>
            <tr>
                <td width="11%"><input type="button" value=" A " data-letter="a"></td>
                <td width="11%"><input type="button" value=" B " data-letter="b"></td>
                <td width="11%"><input type="button" value=" C " data-letter="c"></td>
                <td width="11%"><input type="button" value=" D " data-letter="d"></td>
                <td width="11%"><input type="button" value=" E " data-letter="e"></td>
                <td width="11%"><input type="button" value=" F " data-letter="f"></td>
                <td width="34%"><input type="button" value="Juego nuevo" data-new-game></td>
            </tr>
            <tr>
                <td><input type="button" value=" G " data-letter="g"></td>
                <td><input type="button" value=" H " data-letter="h"></td>
                <td><input type="button" value=" I " data-letter="i"></td>
                <td><input type="button" value=" J " data-letter="j"></td>
                <td><input type="button" value=" K " data-letter="k"></td>
                <td><input type="button" value=" L " data-letter="l"></td>
                <td></td>
            </tr>
            <tr>
                <td><input type="button" value=" M " data-letter="m"></td>
                <td><input type="button" value=" N " data-letter="n"></td>
                <td><input type="button" value=" Ñ " data-letter="ñ"></td>
                <td><input type="button" value=" O " data-letter="o"></td>
                <td><input type="button" value=" P " data-letter="p"></td>
                <td><input type="button" value=" Q " data-letter="q"></td>
                <td></td>
            </tr>
            <tr>
                <td><input type="button" value=" R " data-letter="r"></td>
                <td><input type="button" value=" S " data-letter="s"></td>
                <td><input type="button" value=" T " data-letter="t"></td>
                <td><input type="button" value=" U " data-letter="u"></td>
                <td><input type="button" value=" V " data-letter="v"></td>
                <td><input type="button" value=" W " data-letter="w"></td>
                <td></td>
            </tr>
            <tr>
                <td><input type="button" value=" X " data-letter="x"></td>
                <td><input type="button" value=" Y " data-letter="y"></td>
                <td><input type="button" value=" Z " data-letter="z"></td>
                <td colspan="3"></td>
                <td></td>
            </tr>
        </table>
    </form>

    <form class="back-form" method="GET" action="Pagina Principal.html">
        <input type="submit" value="Volver">
    </form>
</body>
</html>
